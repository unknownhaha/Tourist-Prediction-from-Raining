roles:
  operator:
    title: Pipeline operator
    brief: Install dependencies, run ingest → staging → core → QA, and know when to rerun only part of the pipeline after downloads or config changes.
  ds_ml:
    title: Data science / ML
    brief: Start modeling from province_month.parquet (77 × 92 spine). Use the long table for custom metrics; this pipeline does not build model features.
  qa:
    title: QA / analyst
    brief: Run automated checks and pytest, interpret coverage and manifest status, and review MOTS quarantine CSVs when numbers look low.
  stakeholder:
    title: Stakeholder
    brief: What data sources feed the project, the published date window, and what the combined table represents — without running Python.

