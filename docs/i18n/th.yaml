roles:
  operator:
    title: ผู้ดูแลไปปไลน์
    brief: ติดตั้ง dependencies รัน ingest → staging → core → QA และรู้ว่าควรรันเฉพาะส่วนใดหลังเปลี่ยนการดาวน์โหลดหรือ config
  ds_ml:
    title: วิทยาการข้อมูล / ML
    brief: เริ่มโมเดลจาก province_month.parquet (โครงสร้าง 77 × 92) ใช้ตาราง long สำหรับ metric อื่น ไปปไลน์ไม่สร้างฟีเจอร์โมเดล
  qa:
    title: QA / นักวิเคราะห์
    brief: รัน checks และ pytest อ่าน coverage และ manifest ตรวจ quarantine CSV ของ MOTS เมื่อตัวเลขต่ำ
  stakeholder:
    title: ผู้มีส่วนได้ส่วนเสีย
    brief: แหล่งข้อมูล ช่วงเวลา และความหมายของตารางรวม โดยไม่ต้องรัน Python

