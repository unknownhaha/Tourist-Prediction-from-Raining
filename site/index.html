ata dictionary<\/a>.<\/p>", "plain": "National picture Monthly view of province_month.parquet aggregated across all 77 provinces (2018-01–2025-08 CE). The chart above shows: Guest arrivals — sum of guest_arrivals each month. Visitors — sum of visitors_total where published (gaps before ~2023 are missing data, not zero). Rainfall — mean of avg_rain_mm (right axis, mm). Shaded band — project is_covid window (2020-03–2022-12); not a causal claim. This pipeline prepares data only; it does not train or run prediction models. For table definitions see the Data dictionary .", "generated": false}, {"id": "index", "title": "Handbook index", "html": "<h1>Project handbook<\/h1>\n<p>Province × month datasets (<strong>2018-01<\/strong> through <strong>2025-08<\/strong> CE) combining HII rainfall, MOTS tourism attachments, and NSO accommodation survey metadata.<\/p>\n<h2>Start by role<\/h2>\n<table>\n<thead>\n<tr>\n<th>Role<\/th>\n<th>Start here<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pipeline operator<\/td>\n<td><a href=\"pipeline_operators.md\">Operator runbook<\/a><\/td>\n<\/tr>\n<tr>\n<td>Data science / ML<\/td>\n<td><a href=\"national_picture.md\">National picture<\/a> then <a href=\"handoff_ds_ml_qa.md\">handoff<\/a> and <a href=\"data_dictionary.md\">Data dictionary<\/a><\/td>\n<\/tr>\n<tr>\n<td>QA / analyst<\/td>\n<td><a href=\"handoff_ds_ml_qa.md\">Handoff<\/a> plus <a href=\"coverage_report.md\">Coverage report<\/a><\/td>\n<\/tr>\n<tr>\n<td>Stakeholder / PM<\/td>\n<td><a href=\"national_picture.md\">National picture<\/a> (chart)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Interactive explorer<\/h2>\n<p>Open <strong><code>site/index.html<\/code><\/strong> in a browser (double-click or drag into Chrome/Edge). Use <strong>English / ไทย<\/strong> in the header to switch languages. Thai prose lives under <a href=\"th/index.md\"><code>docs/th/<\/code><\/a>. Regenerate after handbook edits:<\/p>\n<pre><code class=\"language-powershell\">python -m src.docs.build_site\n<\/code><\/pre>\n<h2>Quick reference<\/h2>\n<ul>\n<li><strong>Modeling table:<\/strong> <code>data/core/province_month.parquet<\/code><\/li>\n<li><strong>Run order:<\/strong> see <a href=\"pipeline_operators.md\">Operator runbook<\/a> or <a href=\"../README.md\">README<\/a><\/li>\n<li><strong>Contracts:<\/strong> <code>config/data_contracts.yaml<\/code><\/li>\n<li><strong>Sources &amp; dates:<\/strong> <code>config/sources.yaml<\/code><\/li>\n<\/ul>", "plain": "Project handbook Province × month datasets ( 2018-01 through 2025-08 CE) combining HII rainfall, MOTS tourism attachments, and NSO accommodation survey metadata. Start by role Role Start here Pipeline operator Operator runbook Data science / ML National picture then handoff and Data dictionary QA / analyst Handoff plus Coverage report Stakeholder / PM National picture (chart) Interactive explorer Open site/index.html in a browser (double-click or drag into Chrome/Edge). Use English / ไทย in the header to switch languages. Thai prose lives under docs/th/ . Regenerate after handbook edits: python -m src.docs.build_site Quick reference Modeling table: data/core/province_month.parquet Run order: see Operator runbook or README Contracts: config/data_contracts.yaml Sources &amp; dates: config/sources.yaml", "generated": false}, {"id": "stakeholder", "title": "Stakeholder overview", "html": "<h1>Stakeholder overview<\/h1>\n<p>This project builds a <strong>province-by-month<\/strong> dataset for analyzing tourism and rainfall across all <strong>77<\/strong> Thai provinces over a fixed calendar window.<\/p>\n<h2>What we combine<\/h2>\n<table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>What it provides<\/th>\n<th>In the main modeling table?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>HII<\/strong> (Hydro-Informatics Institute)<\/td>\n<td>Monthly average rainfall by province<\/td>\n<td>Yes — <code>avg_rain_mm<\/code> on every spine row<\/td>\n<\/tr>\n<tr>\n<td><strong>MOTS<\/strong> (Ministry of Tourism and Sports)<\/td>\n<td>Tourism statistics from published Excel/PDF attachments<\/td>\n<td>Partially — see below<\/td>\n<\/tr>\n<tr>\n<td><strong>NSO<\/strong> (National Statistical Office)<\/td>\n<td>Accommodation survey rounds (MD survey)<\/td>\n<td>Separate table only; <strong>not<\/strong> a monthly tourism series<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>The main deliverable for modeling<\/h2>\n<p><strong><code>province_month.parquet<\/code><\/strong> is a complete grid: every province × every month in the window (<strong>2018-01<\/strong> to <strong>2025-08<\/strong>), with columns for rainfall, two tourism measures where available, and a COVID-era flag.<\/p>\n<ul>\n<li><strong><code>guest_arrivals<\/code><\/strong> — from MOTS domestic quarterly workbooks, spread to months where the pipeline can parse them; coverage is strong across the window when sources publish.<\/li>\n<li><strong><code>visitors_total<\/code><\/strong> — from MOTS monthly province reports; typically populated from <strong>2023-01<\/strong> onward (see the live <a href=\"coverage_report.md\">Coverage report<\/a>).<\/li>\n<li><strong><code>is_covid<\/code><\/strong> — project-defined flag for <strong>2020-03<\/strong> through <strong>2022-12<\/strong>. It marks a disruption window for analysis; it is <strong>not<\/strong> a claim about causation or policy impact.<\/li>\n<\/ul>\n<p>Sub-areas (e.g. Pattaya, Koh Chang) appear in the long tourism table but are <strong>not<\/strong> rolled into <code>province_month<\/code>.<\/p>\n<h2>What this pipeline does not do<\/h2>\n<ul>\n<li>It does <strong>not<\/strong> train or deploy prediction models.<\/li>\n<li>It does <strong>not<\/strong> add lags, rolling means, or other ML features.<\/li>\n<li>It does <strong>not<\/strong> guarantee that every tourism cell is filled — gaps reflect missing or unparsed source publications. The <a href=\"coverage_report.md\">Coverage report<\/a> is the authoritative snapshot of fill rates after each build.<\/li>\n<\/ul>\n<h2>Data quality and provenance<\/h2>\n<p>Downloads are logged in <strong><code>data/manifest/manifest_downloads.csv<\/code><\/strong>. QA summarizes <strong>latest status per URL<\/strong>, not every historical retry. Files that cannot be parsed safely are listed under <strong><code>data/staging/mots/quarantine/<\/code><\/strong>.<\/p>\n<p>For technical run instructions, operators use the <a href=\"pipeline_operators.md\">Operator runbook<\/a>. For table definitions, see the <a href=\"data_dictionary.md\">Data dictionary<\/a>.<\/p>", "plain": "Stakeholder overview This project builds a province-by-month dataset for analyzing tourism and rainfall across all 77 Thai provinces over a fixed calendar window. What we combine Source What it provides In the main modeling table? HII (Hydro-Informatics Institute) Monthly average rainfall by province Yes — avg_rain_mm on every spine row MOTS (Ministry of Tourism and Sports) Tourism statistics from published Excel/PDF attachments Partially — see below NSO (National Statistical Office) Accommodation survey rounds (MD survey) Separate table only; not a monthly tourism series The main deliverable for modeling province_month.parquet is a complete grid: every province × every month in the window ( 2018-01 to 2025-08 ), with columns for rainfall, two tourism measures where available, and a COVID-era flag. guest_arrivals — from MOTS domestic quarterly workbooks, spread to months where the pipeline can parse them; coverage is strong across the window when sources publish. visitors_total — from MOTS monthly province reports; typically populated from 2023-01 onward (see the live Coverage report ). is_covid — project-defined flag for 2020-03 through 2022-12 . It marks a disruption window for analysis; it is not a claim about causation or policy impact. Sub-areas (e.g. Pattaya, Koh Chang) appear in the long tourism table but are not rolled into province_month . What this pipeline does not do It does not train or deploy prediction models. It does not add lags, rolling means, or other ML features. It does not guarantee that every tourism cell is filled — gaps reflect missing or unparsed source publications. The Coverage report is the authoritative snapshot of fill rates after each build. Data quality and provenance Downloads are logged in data/manifest/manifest_downloads.csv . QA summarizes latest status per URL , not every historical retry. Files that cannot be parsed safely are listed under data/staging/mots/quarantine/ . For technical run instructions, operators use the Operator runbook . For table definitions, see the Data dictionary .", "generated": false}, {"id": "operator", "title": "Operator runbook", "html": "<h1>Operator runbook<\/h1>\n<p>Run from the repository root (<code>e:\\Tourist-Prediction-from-Raining<\/code> or your clone path).<\/p>\n<h2>Prerequisites<\/h2>\n<pre><code class=\"language-powershell\">pip install -r requirements.txt\npython -m playwright install chromium\n<\/code><\/pre>\n<ul>\n<li><strong>Python 3.11+<\/strong> (local/CI may use 3.14).<\/li>\n<li><strong>7-Zip<\/strong> (<code>7z.exe<\/code>) on Windows for NSO RAR extraction.<\/li>\n<\/ul>\n<h2>Full pipeline (cold start)<\/h2>\n<pre><code class=\"language-powershell\">python -m src.ingest.hii\npython -m src.ingest.nso\npython -m src.ingest.mots_crawler --build-tree\npython -m src.ingest.mots_crawler --year-be 2561\npython -m src.ingest.mots_crawler --all\npython -m src.ingest.mots_cleanup\npython -m src.staging\npython -m src.catalog.profile_mots\npython -m src.core.build_core\npython -m src.qa.checks\npython -m src.qa.coverage_report\npython -m pytest tests/\npython -m src.docs.build_site\n<\/code><\/pre>\n<p><code>mots_cleanup<\/code> and <code>profile_mots<\/code> are optional but recommended after a full MOTS crawl. Regenerate the HTML handbook after coverage or markdown changes.<\/p>\n<h2>Partial reruns<\/h2>\n<table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Run<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Raw downloads already present; only parsers or crosswalk changed<\/td>\n<td><code>python -m src.staging<\/code> → <code>python -m src.core.build_core<\/code> → QA<\/td>\n<\/tr>\n<tr>\n<td>Only <code>config/province_crosswalk.csv<\/code> updated<\/td>\n<td>Staging → core → QA<\/td>\n<\/tr>\n<tr>\n<td>Only HII CSV refreshed<\/td>\n<td><code>python -m src.ingest.hii<\/code> → core → QA<\/td>\n<\/tr>\n<tr>\n<td>NSO RARs on disk, skip download<\/td>\n<td><code>python -m src.ingest.nso --stage-only<\/code> → core → QA<\/td>\n<\/tr>\n<tr>\n<td>Contract thresholds or QA logic only<\/td>\n<td><code>python -m src.qa.checks<\/code> and pytest<\/td>\n<\/tr>\n<tr>\n<td>Handbook or explorer content<\/td>\n<td><code>python -m src.docs.build_site<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Stage reference<\/h2>\n<h3>HII — <code>python -m src.ingest.hii<\/code><\/h3>\n<p>Downloads the spatial rainfall CSV from HII, appends manifest rows, writes staging rainfall Parquet.<\/p>\n<h3>NSO — <code>python -m src.ingest.nso<\/code><\/h3>\n<p>Fetches configured MD survey rounds, extracts RARs, builds accommodation inventory staging. <strong><code>--stage-only<\/code><\/strong>: extract/stage existing RARs without new downloads.<\/p>\n<h3>MOTS crawler — <code>python -m src.ingest.mots_crawler<\/code><\/h3>\n<table>\n<thead>\n<tr>\n<th>Flag<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>--build-tree<\/code><\/td>\n<td>Write <code>config/mots_category_tree.json<\/code> only<\/td>\n<\/tr>\n<tr>\n<td><code>--year-be 2561<\/code><\/td>\n<td>Crawl one Buddhist Era year (pilot)<\/td>\n<\/tr>\n<tr>\n<td><code>--all<\/code><\/td>\n<td>All years in <code>config/sources.yaml<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>--inventory-only<\/code><\/td>\n<td>Dry-run inventory<\/td>\n<\/tr>\n<tr>\n<td><code>--skip-posts<\/code><\/td>\n<td>Category attachments only (skip per-news Playwright)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Staging — <code>python -m src.staging<\/code><\/h3>\n<p>Walks <code>data/raw/mots/<\/code> workbooks, dispatches layouts, dedupes, writes <code>data/staging/mots/fact_tourism_long.parquet<\/code>. Unmapped names go to <strong><code>unmapped_provinces.csv<\/code><\/strong>; unparsed files to <strong><code>quarantine.csv<\/code><\/strong>.<\/p>\n<h3>Core — <code>python -m src.core.build_core<\/code><\/h3>\n<p>Writes seven Parquet files under <strong><code>data/core/<\/code><\/strong>, including <strong><code>province_month.parquet<\/code><\/strong>.<\/p>\n<h3>QA<\/h3>\n<ul>\n<li><strong><code>python -m src.qa.checks<\/code><\/strong> — validates grains, columns, coverage floors in <code>config/data_contracts.yaml<\/code>, manifest failures, quarantine counts.<\/li>\n<li><strong><code>python -m src.qa.coverage_report<\/code><\/strong> — refreshes <code>docs/coverage_report.md<\/code>.<\/li>\n<li><strong><code>python -m pytest tests/<\/code><\/strong> — regression tests.<\/li>\n<\/ul>\n<h2>Do not hand-edit<\/h2>\n<ul>\n<li><strong><code>data/raw/<\/code><\/strong> — replace by re-ingest.<\/li>\n<li><strong><code>data/manifest/manifest_downloads.csv<\/code><\/strong> — append-only log from ingest.<\/li>\n<li><strong><code>site/<\/code><\/strong> — generated; edit <code>docs/<\/code> and run <code>build_site<\/code>.<\/li>\n<\/ul>\n<h2>Troubleshooting<\/h2>\n<ul>\n<li>Low tourism coverage: inspect <strong><code>data/staging/mots/quarantine/<\/code><\/strong> and re-run staging after fixing raw files or crosswalk.<\/li>\n<li>QA manifest errors: check latest status per URL in manifest summary output; re-crawl failed MOTS URLs if needed.<\/li>\n<li><strong><code>guest_arrivals<\/code> / <code>visitors_total<\/code> floors<\/strong>: defined in <code>config/data_contracts.yaml<\/code> under <code>province_month.coverage<\/code>.<\/li>\n<\/ul>", "plain": "Operator runbook Run from the repository root ( e:\\Tourist-Prediction-from-Raining or your clone path). Prerequisites pip install -r requirements.txt python -m playwright install chromium Python 3.11
